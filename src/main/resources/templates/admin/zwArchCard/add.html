<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('水源地/水厂档案立卡')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">归属底档</label>
                <div class="layui-input-block">
                    <select name="siteNo" lay-verify="required" lay-search="">
                        <option value="">请选择在用底档（挂接只凭编号核对）</option>
                        <option th:each="s : ${sites}" th:value="${s.siteNo}"
                                th:text="${s.siteNo} + '｜' + ${s.siteName} + '｜' + ${s.siteType}"></option>
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">供水规模</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" min="0" name="qty" lay-verify="required"
                           class="layui-input" placeholder="万吨/日；层级由系统按底档三档上限折算回填">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">本年度新增规模</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" min="0" name="fineAmt"
                           class="layui-input" placeholder="万吨/日，可留空">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" placeholder="可留空"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">系统给的三样</label>
                <div class="layui-input-block">
                    <div class="layui-form-mid" style="line-height: 20px;">
                        档案卡号提交后由系统发号；保障强度层级按底档三档上限压着上界往高折算；
                        校验码得卡行至钉住那一步才定形——本页一律不留手填格子。
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="arch-card-save">
                <i class="layui-icon layui-icon-ok"></i>
                立卡
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'layer'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;

        form.on('submit(arch-card-save)', function (data) {
            $.ajax({
                url: rootPath + '/ZwArchCardController/add',
                type: 'post',
                data: data.field,
                success: function (res) {
                    if (res.code === 200) {
                        layer.msg(res.msg || '立卡成功', {icon: 1}, function () {
                            let idx = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(idx);
                            parent.layui.table.reload('arch-card-table');
                        });
                    } else {
                        layer.msg(res.msg || '立卡未生效', {icon: 2});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
