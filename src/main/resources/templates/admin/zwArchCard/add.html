<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('立水源地/水厂档案卡')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">档案卡号</label>
                <div class="layui-input-block">
                    <div class="layui-form-mid" style="line-height: 38px;">
                        由系统发号，本页没有手填格；一张卡管一处水源或一座水厂
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">挂哪家底档</label>
                <div class="layui-input-block">
                    <select name="siteId" lay-verify="required" lay-search="">
                        <option value="">请选择在用底档（挂接只凭编号，名字像不认）</option>
                        <option th:each="s : ${sites}" th:value="${s.id}"
                                th:text="${s.siteNo} + '｜' + ${s.siteName} + '（' + ${s.siteType} + '）'"></option>
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">供水规模</label>
                <div class="layui-input-inline" style="width: 180px;">
                    <input type="number" step="0.01" min="0" name="qty" lay-verify="required"
                           class="layui-input" placeholder="万吨/日">
                </div>
                <div class="layui-form-mid layui-word-aux">
                    保障强度层级由系统按所挂底档三道上限折（等于上限往高算一档），没有手填口
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">本年度新增规模</label>
                <div class="layui-input-inline" style="width: 180px;">
                    <input type="number" step="0.01" min="0" name="fineAmt" class="layui-input"
                           placeholder="万吨/日，没有可留空">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" placeholder="可留空"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="zw-card-save">
                <i class="layui-icon layui-icon-ok"></i>
                立卡（落待核对）
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'layer'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;

        form.on('submit(zw-card-save)', function (data) {
            $.ajax({
                url: rootPath + '/zwArchCard/add',
                type: 'post',
                data: data.field,
                success: function (res) {
                    if (res.code === 200) {
                        layer.msg('已立卡，卡号 ' + res.data.billNo + '，层级：' + res.data.gradeLevel + ' 档',
                            {icon: 1}, function () {
                                let idx = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(idx);
                                parent.layui.table.reload('zw-card-table');
                            });
                    } else {
                        layer.msg(res.msg || '立卡未受理', {icon: 2});
                    }
                }
            });
            return false;
        });
    });
</script>
</html>
