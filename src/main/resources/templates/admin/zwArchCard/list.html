<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('水源地/水厂档案卡台账')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">档案卡号</label>
                <div class="layui-input-inline">
                    <input type="text" name="billNo" placeholder="系统发号" class="layui-input">
                </div>
                <label class="layui-form-label">底档代号</label>
                <div class="layui-input-inline">
                    <input type="text" name="siteNo" class="layui-input">
                </div>
                <label class="layui-form-label">强度层级</label>
                <div class="layui-input-inline">
                    <select name="gradeLevel" class="layui-input">
                        <option value="">全部</option>
                        <option value="1">一档</option>
                        <option value="2">二档</option>
                        <option value="3">三档</option>
                        <option value="0">折不出</option>
                    </select>
                </div>
                <label class="layui-form-label">当前进度</label>
                <div class="layui-input-inline">
                    <select name="status" class="layui-input">
                        <option value="">全部</option>
                        <option value="0">待核对</option>
                        <option value="1">已核对</option>
                        <option value="2">已压死</option>
                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="zw-card-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="zw-card-table" lay-filter="zw-card-table"></table>
    </div>
</div>
</body>

<script type="text/html" id="zw-card-toolbar">
    <button shiro:hasPermission="zw:zwArchCard:add" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        立档案卡
    </button>
</script>

<script type="text/html" id="zw-card-bar">
    <a class="pear-btn pear-btn-primary pear-btn-sm" lay-event="detail">
        <i class="layui-icon layui-icon-about"></i> 版本倒查
    </a>
    {{#  if(d.status == 0){ }}
    <button shiro:hasPermission="zw:zwArchCard:edit" class="pear-btn pear-btn-normal pear-btn-sm" lay-event="confirm">
        <i class="layui-icon layui-icon-ok"></i> 核对
    </button>
    <button shiro:hasPermission="zw:zwArchCard:edit" class="pear-btn pear-btn-warming pear-btn-sm" lay-event="revise">
        <i class="layui-icon layui-icon-edit"></i> 重录一版
    </button>
    {{#  } else if(d.status == 1){ }}
    <button shiro:hasPermission="zw:zwArchCard:edit" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="pin">
        <i class="layui-icon layui-icon-auz"></i> 压死钉串
    </button>
    <button shiro:hasPermission="zw:zwArchCard:edit" class="pear-btn pear-btn-warming pear-btn-sm" lay-event="revise">
        <i class="layui-icon layui-icon-edit"></i> 重录一版
    </button>
    {{#  } else { }}
    <span class="layui-badge layui-bg-gray">已压死·改须另录新版</span>
    {{#  } }}
    <button shiro:hasPermission="zw:zwArchCard:remove" class="pear-btn pear-btn-sm" lay-event="remove">
        <i class="layui-icon layui-icon-delete"></i> 删卡
    </button>
</script>

<script type="text/html" id="zw-card-status">
    {{#  if(d.status == 0){ }}<span class="layui-badge layui-bg-orange">待核对</span>
    {{#  } else if(d.status == 1){ }}<span class="layui-badge layui-bg-blue">已核对</span>
    {{#  } else if(d.status == 2){ }}<span class="layui-badge layui-bg-green">已压死</span>
    {{#  } }}
</script>

<script type="text/html" id="zw-card-grade">
    {{#  if(d.gradeLevel == 1){ }}一档
    {{#  } else if(d.gradeLevel == 2){ }}二档
    {{#  } else if(d.gradeLevel == 3){ }}<b>三档</b>
    {{#  } else { }}<span class="layui-badge">折不出</span>
    {{#  } }}
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery', 'layer'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;

        let MODULE_PATH = rootPath + "/zwArchCard/";
        let cols = [
            [
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '档案卡号', field: 'billNo', align: 'center', width: 120},
                {title: '版次', field: 'nodeNo', align: 'center', width: 70},
                {title: '底档代号', field: 'siteNo', align: 'center', width: 100},
                {title: '供水规模(万吨/日)', field: 'qty', align: 'center', width: 140},
                {title: '本年度新增(万吨/日)', field: 'fineAmt', align: 'center', width: 150},
                {title: '保障强度层级', field: 'gradeLevel', align: 'center', width: 120, templet: '#zw-card-grade'},
                {title: '当前进度', field: 'status', align: 'center', width: 100, templet: '#zw-card-status'},
                {title: '校验串（压死才钉）', field: 'content', align: 'center', minWidth: 280},
                {title: '当初立卡人', field: 'founder', align: 'center', width: 100},
                {title: '立卡时间', field: 'founderTime', align: 'center', width: 170},
                {title: '最近改动人', field: 'createBy', align: 'center', width: 100},
                {title: '最近改动时间', field: 'createTime', align: 'center', width: 170},
                {title: '操作', toolbar: '#zw-card-bar', align: 'center', width: 330, fixed: 'right'}
            ]
        ];

        table.render({
            elem: '#zw-card-table',
            url: MODULE_PATH + 'list',
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            toolbar: '#zw-card-toolbar',
            defaultToolbar: ['filter', 'print', 'exports']
        });

        table.on('toolbar(zw-card-table)', function (obj) {
            if (obj.event === 'add') {
                layer.open({
                    type: 2, title: '立水源地/水厂档案卡（卡号系统发）', area: ['720px', '560px'],
                    content: MODULE_PATH + 'add'
                });
            }
        });

        table.on('tool(zw-card-table)', function (obj) {
            if (obj.event === 'detail') {
                layer.open({
                    type: 2, title: '版本倒查 ' + obj.data.billNo, area: ['900px', '600px'],
                    content: MODULE_PATH + 'detail/' + obj.data.billNo
                });
            } else if (obj.event === 'revise') {
                layer.open({
                    type: 2, title: '重录新版 ' + obj.data.billNo + '（旧版留痕）', area: ['720px', '560px'],
                    content: MODULE_PATH + 'revise/' + obj.data.id
                });
            } else if (obj.event === 'confirm') {
                $.ajax({
                    url: MODULE_PATH + 'confirm', type: 'post', data: {id: obj.data.id},
                    success: function (res) {
                        if (res.code === 200) {
                            layer.msg('已核对', {icon: 1});
                            table.reload('zw-card-table');
                        } else {
                            layer.msg(res.msg || '操作未生效', {icon: 2});
                        }
                    }
                });
            } else if (obj.event === 'pin') {
                layer.confirm('压死后校验串当场钉死，本行谁也改不得，要改只能另录新版。确认压死？',
                    {title: '压死钉串', icon: 3}, function (idx) {
                        $.ajax({
                            url: MODULE_PATH + 'pin', type: 'post', data: {id: obj.data.id},
                            success: function (res) {
                                if (res.code === 200) {
                                    layer.close(idx);
                                    layer.msg('已压死，校验串：' + res.data.content, {icon: 1});
                                    table.reload('zw-card-table');
                                } else {
                                    layer.msg(res.msg || '操作未生效', {icon: 2});
                                }
                            }
                        });
                    });
            } else if (obj.event === 'remove') {
                layer.confirm('整张卡（含各版留痕行）一并软删，不物理清除。确认删除？',
                    {title: '删卡', icon: 3}, function (idx) {
                        $.ajax({
                            url: MODULE_PATH + 'remove', type: 'delete', data: {ids: obj.data.id},
                            success: function (res) {
                                if (res.code === 200) {
                                    layer.close(idx);
                                    layer.msg('已删卡', {icon: 1});
                                    table.reload('zw-card-table');
                                } else {
                                    layer.msg(res.msg || '删除未生效', {icon: 2});
                                }
                            }
                        });
                    });
            }
        });

        form.on('submit(zw-card-query)', function (data) {
            table.reload('zw-card-table', {where: data.field, page: {curr: 1}});
            return false;
        });
    });
</script>
</html>
