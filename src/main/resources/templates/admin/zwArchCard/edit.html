<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('重录一版')"/>
</head>
<body>
<form class="layui-form" th:if="${card != null}">
    <input type="hidden" name="id" th:value="${card.id}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">档案卡号</label>
                <div class="layui-input-block">
                    <div class="layui-form-mid" th:text="${card.billNo} + '（当前第' + ${card.nodeNo} + '版，保存后另起一版）'"></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">归属底档</label>
                <div class="layui-input-block">
                    <select name="siteNo" lay-verify="required" lay-search="">
                        <option th:each="s : ${sites}" th:value="${s.siteNo}"
                                th:selected="${s.siteNo == card.siteNo}"
                                th:text="${s.siteNo} + '｜' + ${s.siteName} + '｜' + ${s.siteType}"></option>
                    </select>
                    <div class="layui-form-mid" style="line-height: 20px;">
                        改挂只凭编号核对；退役底档不许新挂，名下旧卡只查不改
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">供水规模</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" min="0" name="qty" lay-verify="required"
                           class="layui-input" th:value="${card.qty}" placeholder="万吨/日">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">本年度新增规模</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" min="0" name="fineAmt"
                           class="layui-input" th:value="${card.fineAmt}" placeholder="万吨/日，可留空">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">当前进度</label>
                <div class="layui-input-block">
                    <select name="status" lay-verify="required">
                        <option value="0" th:selected="${card.status == 0}">待核对</option>
                        <option value="1" th:selected="${card.status == 1}">已核对</option>
                        <option value="2" th:selected="${card.status == 2}">已压死（钉住）</option>
                    </select>
                    <div class="layui-form-mid" style="line-height: 20px;">
                        选到已压死，本版校验码按今日定形；旧版那串原样留着，谁也不许改
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="${card.remark}"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">系统回填</label>
                <div class="layui-input-block">
                    <div class="layui-form-mid" style="line-height: 20px;">
                        保障强度层级按目标底档三档上限重新折算；卡号随卡不随版；
                        立卡人 [[${card.createBy}]] 随卡留底，本次重录人记为最近修改人。
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="arch-card-edit">
                <i class="layui-icon layui-icon-ok"></i>
                重录一版
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<div th:if="${card == null}" style="padding:30px;">
    这张卡不在当前在用位置（或已退下备查），旧版只查不改。
</div>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'layer'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;

        form.on('submit(arch-card-edit)', function (data) {
            $.ajax({
                url: rootPath + '/ZwArchCardController/edit',
                type: 'post',
                data: data.field,
                success: function (res) {
                    if (res.code === 200) {
                        layer.msg(res.msg || '已重录一版', {icon: 1}, function () {
                            let idx = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(idx);
                            parent.layui.table.reload('arch-card-table');
                        });
                    } else {
                        layer.msg(res.msg || '重录未生效', {icon: 2});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
