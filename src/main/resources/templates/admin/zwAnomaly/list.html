<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('水质异常判定登记')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">登记号</label>
                <div class="layui-input-inline">
                    <input type="text" name="anomNo" placeholder="点位-日期-指标" class="layui-input">
                </div>
                <label class="layui-form-label">点位</label>
                <div class="layui-input-inline">
                    <input type="text" name="siteNo" placeholder="如 ZS00" class="layui-input">
                </div>
                <label class="layui-form-label">指标</label>
                <div class="layui-input-inline">
                    <input type="text" name="itemCode" placeholder="如 CL" class="layui-input">
                </div>
                <label class="layui-form-label">档位</label>
                <div class="layui-input-inline">
                    <select name="gradeLevel" class="layui-input">
                        <option value="">全部</option>
                        <option value="2">关注</option>
                        <option value="3">超标</option>
                        <option value="4">严重超标</option>
                    </select>
                </div>
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline">
                    <select name="reported" class="layui-input">
                        <option value="">全部</option>
                        <option value="0">未上报</option>
                        <option value="1">已上报</option>
                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="anom-query">
                    <i class="layui-icon layui-icon-search"></i> 查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i> 重置
                </button>
            </div>
        </form>
        <span style="color:#999;font-size:12px;">
            异常一判出来系统自动登记：哪条标准线、当天界值、超了多少、关注还是超标、要不要停水/复测全在本条。
            点"下钻"看当日原始检测记录、当天生效的标准与完整判定过程。
        </span>
        <a class="pear-btn pear-btn-md pear-btn-normal" th:href="@{/zwAnomaly/reportView}" style="float:right;">上报处置台账</a>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="anom-table" lay-filter="anom-table"></table>
    </div>
</div>

<script type="text/html" id="anom-grade">
    {{#  if(d.gradeLevel == 4){ }}<span class="layui-badge">严重超标</span>
    {{#  } else if(d.gradeLevel == 3){ }}<span class="layui-badge layui-bg-orange">超标</span>
    {{#  } else if(d.gradeLevel == 2){ }}<span class="layui-badge layui-bg-blue">关注</span>
    {{#  } }}
</script>

    {{#  if(d.archived == 1){ }}<span class="layui-badge">已归档</span>{{#  } }}
    {{#  if(d.closed == 1 && d.archived != 1){ }}<span class="layui-badge">已结案</span>{{#  } }}
    {{#  if(d.reflected == 1){ }}<span class="layui-badge layui-bg-green">已反映供水户</span>{{#  } }}
    {{#  if(d.reported == 1 && d.reflected != 1){ }}<span class="layui-badge layui-bg-gray">已上报·只读</span>{{#  } }}

<script type="text/html" id="anom-bar">
    <a class="layui-btn layui-btn-xs pear-btn-primary" lay-event="detail">下钻</a>
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table, form = layui.form, $ = layui.jquery;
        let MODULE_PATH = rootPath + '/zwAnomaly/';
        table.render({
            elem: '#anom-table',
            url: MODULE_PATH + 'list',
            page: true, method: 'get', skin: 'line',
            cols: [[
                {title: 'ID', field: 'id', hide: true},
                {title: '登记号', field: 'anomNo', width: 180},
                {title: '点位', field: 'siteNo', width: 90, align: 'center'},
                {title: '检测日', field: 'testDay', width: 110, align: 'center'},
                {title: '指标', field: 'itemCode', width: 80, align: 'center'},
                {title: '检测值', field: 'qty', width: 90, align: 'center'},
                {title: '档位', field: 'gradeLevel', width: 100, align: 'center', templet: '#anom-grade'},
                {title: '标准线', field: 'ruleCode', width: 130, align: 'center'},
                {title: '超了多少', align: 'center', width: 150, templet: function (d) {
                        return d.overAmt == null ? '—' : '越 ' + d.baseTh + '，超 ' + d.overAmt;
                    }},
                {title: '处置', align: 'center', width: 130, templet: function (d) {
                        return (d.needRetest === 1 ? '复测 ' : '') + (d.needStop === 1 ? '停水' : '');
                    }},
                {title: '更正', field: 'correctTimes', width: 70, align: 'center',
                    templet: function (d) { return d.correctTimes ? d.correctTimes + ' 轮' : '0'; }},
                {title: '状态', width: 190, align: 'center', templet: '#anom-flags'},
                {title: '操作', width: 90, align: 'center', fixed: 'right', toolbar: '#anom-bar'}
            ]]
        });
        form.on('submit(anom-query)', function (data) {
            table.reload('anom-table', {where: data.field, page: {curr: 1}});
            return false;
        });
        table.on('tool(anom-table)', function (obj) {
            if (obj.event === 'detail') {
                window.location.href = MODULE_PATH + 'detail/' + obj.data.id;
            }
        });
    });
</script>
</body>
</html>
